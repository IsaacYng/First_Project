  --tw-shadow-colored: 0 1px 2px 0 var(--tw-shadow-color);
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.shadow-xl {
  --tw-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
  --tw-shadow-colored: 0 20px 25px -5px var(--tw-shadow-color), 0 8px 10px -6px var(--tw-shadow-color);
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.shadow-orange-200 {
  --tw-shadow-color: #fed7aa;
  --tw-shadow: var(--tw-shadow-colored);
}

.grayscale {
  --tw-grayscale: grayscale(100%);
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.filter {
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.transition {
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke, opacity, box-shadow, transform, filter, backdrop-filter;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

:root{
  --surface:#FFF9F2;
  --surface-2:#FFFFFF;
  --surface-3:#FFEDD5;
  --ink:#1B1512;
  --muted:#756A61;
  --line:#F0DCC8;
  --accent:#F97316;
  --accent-2:#EA580C;
  --accent-soft:#FFF1E6;
  --dark:#191210;
  --dark-2:#2A1D18;
  --success:#15803D;
  --danger:#DC2626;
}

@media (prefers-color-scheme: dark){
  :root{
    --surface:#171210;
    --surface-2:#221B17;
    --surface-3:#2E231C;
    --ink:#FFF7ED;
    --muted:#C3B6AC;
    --line:#3D2F28;
    --accent:#FB923C;
    --accent-2:#F97316;
    --accent-soft:#332219;
    --dark:#0F0B09;
    --dark-2:#1D1410;
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--surface);
  color:var(--ink);
  font-family:'Source Sans 3',system-ui,-apple-system,Segoe UI,sans-serif
}

h1,h2,h3,.display{
  font-family:'Space Grotesk',system-ui,sans-serif
}

button,input,select{
  font:inherit
}

input[type="range"]{
  accent-color:var(--accent)
}

input[type="color"]{
  border:0;
  padding:0;
  background:none
}

.dashed-zone{
  border:2px dashed #FDBA74;
  background:linear-gradient(180deg,#FFFBEB,#FFF7ED)
}

@media (prefers-color-scheme: dark){
  .dashed-zone{
    background:linear-gradient(180deg,#2A1D18,#221B17)
  }
}

.checker{
  background-image:linear-gradient(45deg,#E7E5E4 25%,transparent 25%),linear-gradient(-45deg,#E7E5E4 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#E7E5E4 75%),linear-gradient(-45deg,transparent 75%,#E7E5E4 75%);
  background-size:18px 18px;
  background-position:0 0,0 9px,9px -9px,-9px 0
}

.thumb-strip::-webkit-scrollbar{
  height:8px;
  width:8px
}

.thumb-strip::-webkit-scrollbar-thumb{
  background:#FDBA74;
  border-radius:99px
}

@keyframes pop{
  from{
    opacity:0;
    transform:translateY(6px)
  }

  to{
    opacity:1;
    transform:translateY(0)
  }
}

.pop{
  animation:pop .25s ease both
}

@keyframes spin{
  to{
    transform:rotate(360deg)
  }
}

.spin{
  animation:spin .8s linear infinite
}
