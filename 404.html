<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>Redirecting…</title>
<!-- Any unknown / old link on this site lands here (GitHub Pages serves
     404.html for every not-found path) and is sent straight to the app.
     This file never needs editing again — it just forwards to "/", which
     always serves the latest index.html. -->
<script>
  // Keep the reset handler working even if it's ever reached via 404:
  // forward /reset (with or without query) to reset.html.
  (function(){
    var p = location.pathname || '';
    if (/\/reset\/?$/.test(p)) { location.replace('/reset.html' + location.search); return; }
    location.replace('/' + location.search);
  })();
</script>
<meta http-equiv="refresh" content="0; url=/"/>
<style>
  body{font-family:'DM Sans',system-ui,sans-serif;background:#F1E9E6;color:#5A4740;
       display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;text-align:center}
  a{color:#5A4740;font-weight:700}
</style>
</head>
<body>
  <div>
    <p>Taking you to the panel…</p>
    <p><a href="/">Continue</a></p>
  </div>
</body>
</html>
