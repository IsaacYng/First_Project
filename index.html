const loaded = { home:false, finance:false, sheet:false };

function b64ToUtf8(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}

function loadTab(key, force){
  if (loaded[key] && !force) return;
  const html = b64ToUtf8(PAGES[key]);
  const frame = document.getElementById("frame-" + key);
  const loader = document.getElementById("loader-" + key);
  loader.classList.remove("hidden");
  frame.addEventListener("load", () => {
    loader.classList.add("hidden");
  }, { once: true });
  /* Blank the frame first, then set content on next tick.
     Setting srcdoc synchronously during initial page boot can
     race with the browser's own paint/parse cycle and render blank
     on some mobile WebViews — a tick delay avoids that. */
  frame.srcdoc = "";
  setTimeout(() => { frame.srcdoc = html; }, 30);
  loaded[key] = true;
}

let currentTab = null;

function showTab(key, hash){
  document.querySelectorAll(".tab-frame").forEach(f => f.classList.remove("active"));
  document.getElementById("frame-" + key).classList.add("active");
  const wasCurrent = key === currentTab;
  loadTab(key, wasCurrent);
  currentTab = key;

  if (hash) {
    const frame = document.getElementById("frame-" + key);
    const applyHash = () => {
      try { frame.contentWindow.location.hash = hash; } catch (e) {}
    };
    if (frame.contentDocument && frame.contentDocument.readyState === "complete") {
      applyHash();
    } else {
      frame.addEventListener("load", applyHash, { once: true });
    }
  }
}

/* Original in-page nav links (Home / Finance / Sheet / Price List) inside
   each embedded page postMessage the shell instead of navigating directly,
   since finance.html / sheet.html / index.html aren't real separate files
   here — they're the same three embedded pages. */
window.addEventListener("message", (e) => {
  const data = e.data;
  if (data && data.goto) showTab(data.goto, data.hash);
});

/* Load Home after the shell itself has fully painted, to avoid
   racing the browser during initial page boot. Admin access lives
   entirely at the separate secret.yonghangishak.com.np/admin URL
   (standalone admin.html) — it is not embedded in this shell at all. */
window.addEventListener("load", () => {
  const h = (location.hash || "").replace("#", "");
  const valid = ["home", "finance", "sheet"];
  showTab(valid.includes(h) ? h : "home");
});
</script>
