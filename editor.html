*{
  box-sizing:border-box
}

.card,.container{
  max-width:100%;
  overflow:hidden
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  overflow-x:clip;
  background:#0F172A;
  color:#FFFFFF;
  font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  font-size:16px;
  line-height:1.55;
  font-weight:500
}

img,canvas,video{
  max-width:100%
}

h1,h2,h3,.display{
  font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  letter-spacing:-0.01em;
  font-weight:700;
  color:#FFFFFF
}

h1{
  font-size:clamp(28px,6vw,52px)
}

h2{
  font-size:20px
}

h3{
  font-size:18px
}

p,li,label,span{
  color:inherit
}

button{
  font-family:inherit;
  font-size:17px;
  font-weight:600;
  line-height:1.3
}

input,select,textarea{
  font:inherit;
  font-size:16px;
  font-weight:500
}

.manage-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:8px
}

@media(min-width:768px){
  .manage-grid{
    grid-template-columns:repeat(7,minmax(0,1fr))
  }
}

.manage-btn{
  min-height:48px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  padding:6px 2px;
  border-radius:10px;
  border:1px solid #475569;
  background:#1E293B;
  color:#FFFFFF;
  font-size:12px;
  font-weight:600;
  line-height:1.15;
  text-align:center;
  white-space:normal;
  overflow-wrap:anywhere
}

.manage-btn.active{
  border-color:#F97316;
  background:#431407;
  color:#FED7AA
}

.filename-ellipsis{
  display:block;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:#FFFFFF;
  font-weight:600
}

.dims-nowrap{
  display:block;
  max-width:100%;
  white-space:normal;
  overflow-wrap:break-word;
  word-break:break-word;
  line-height:1.4;
  color:#E2E8F0
}

  flex-wrap:wrap;
  gap:8px;

}

  flex-shrink:0;
  white-space:nowrap
}

input[type="text"],input[type="number"],select,textarea{

@keyframes pop{
  from{
    opacity:0;
    transform:translateY(6px)
  }

  to{
    opacity:1;
    transform:translateY(0)
  }
}

.pop{
  animation:pop .25s ease both
}

@keyframes spin{
  to{
    transform:rotate(360deg)
  }
}

.spin{
  animation:spin .8s linear infinite
}

@keyframes shimmer{
  0%{
    background-position:-400px 0
  }

  100%{
    background-position:400px 0
  }
}

.skeleton{
  background:linear-gradient(90deg:#334155 25%,#1E293B 50%,#334155 75%);
  background-size:800px 100%;
  animation:shimmer 1.2s infinite linear
}

@keyframes toastIn{
  from{
    opacity:0;
    transform:translate(-50%,12px)
  }

  to{
    opacity:1;
    transform:translate(-50%,0)
  }
}

.toast-in{
  animation:toastIn .25s ease both
}

@keyframes pulseBar{
  0%,100%{
    opacity:1
  }

  50%{
    opacity:.55
  }
}

.processing{
  animation:pulseBar 1s ease-in-out infinite
}
